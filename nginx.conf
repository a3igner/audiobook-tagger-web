server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin reverse proxy to a local LiteLLM server.
    # LITELLM_UPSTREAM is substituted at build time (see Dockerfile) and
    # defaults to http://localhost:4000. Override with:
    #   docker build --build-arg LITELLM_UPSTREAM=http://litellm.example.com:4000 ...
    # or pass via docker-compose environment / .env file.
    location /api/litellm/ {
        proxy_pass ${LITELLM_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Audible public catalog — used by lookup_book_isbn for ASIN/publisher/isbn/narrator.
    # Public endpoint, no auth needed. Cloudflare-tolerant via User-Agent.
    location /api/audible/ {
        proxy_pass https://api.audible.com/;
        proxy_set_header Host api.audible.com;
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_ssl_server_name on;
    }

    # Open Library — used by lookup_book_isbn for ISBN/year/publisher.
    # Public endpoint, no auth needed.
    location /api/openlibrary/ {
        proxy_pass https://openlibrary.org/;
        proxy_set_header Host openlibrary.org;
        proxy_ssl_server_name on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
